<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>navigation bar</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        .navigation{
            border: none;
            border-radius: 15px;
            background-color: olive;
            padding: 25px;
        }
       a{
        padding: 25px;
        font-size: 25px;
        text-decoration: none;
        border-radius: 15px;
       }
       a:hover{
        color:white;
        font-size: 25px;
       }
       footer{
        background-color: olive;
        text-align:center;
        font-size: 20px;
    }
    .pimg1{
        position: relative;
        opacity: 0.70;
        background-position: center;
        background-image: url(img1.webp);
        background-attachment: fixed;
        background-size: cover;
        background-repeat:no-repeat;
        min-height: 100vh;
    }
    .section{
        text-align: center;
        padding: 50px 80px;
    }
    .section-dark{
        background-color: #282e34;
        color: whitesmoke;
    }
    </style>
</head>
<body>
      <nav class="navigation">
        <a href="#" >Home</a>
        <a href="#">About us</a>
        <a href="#">Contact us</a>
        <a href="#">gallery</a>
     </nav>
     <div class="pimg1">
        <div class="ptext1">
            <span>
              <h1>welcome to this website</h1>
            </span>
        </div>
     </div>
     <section class="section section-dark">
       <h2> section no.1 </h2>
       <h3>what a nice image</h3>
     </section>

     <script src="cody.js"></script>
     <footer>thank you</footer>
</body>
</html>
